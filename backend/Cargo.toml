[package]
name = "nexus-feed-api"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Backend REST (Axum) do NEXUS FEED, um agregador de notícias RSS/Atom"

[dependencies]
# Servidor HTTP e runtime assíncrono
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Banco de dados (SQLite)
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "chrono", "migrate", "macros"] }

# Serialização, datas e ids
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Download e leitura dos feeds (XML RSS/Atom)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
feed-rs = "2"
scraper = "0.27"
url = "2"

# Erros, configuração e logs
thiserror = "2"
anyhow = "1"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
